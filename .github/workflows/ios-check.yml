name: iOS build and smoke check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show selected Xcode
        run: xcodebuild -version
      - name: Run game-engine regression checks
        working-directory: ios/Bougassaaa-iOS
        run: |
          set -euo pipefail
          swiftc -parse-as-library Sources/GameEngine.swift Tests/EngineChecks.swift -o /tmp/engine-checks
          /tmp/engine-checks
      - name: Build unsigned iOS simulator app
        working-directory: ios/Bougassaaa-iOS
        run: |
          set -o pipefail
          xcodebuild -project BougassaaaSquad.xcodeproj -scheme BougassaaaSquad -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Launch on an iPhone simulator
        working-directory: ios/Bougassaaa-iOS
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/BougassaaaSquad.app
          xcrun simctl launch "$DEVICE" com.example.bougassaaasquad
          sleep 3
          xcrun simctl io "$DEVICE" screenshot simulator-launch.png
          xcrun simctl terminate "$DEVICE" com.example.bougassaaasquad
      - name: Save diagnostic evidence for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-check-evidence
          path: |
            ios/Bougassaaa-iOS/build.log
            ios/Bougassaaa-iOS/simulator-launch.png
          if-no-files-found: ignore
          retention-days: 1
